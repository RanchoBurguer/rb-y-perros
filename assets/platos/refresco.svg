<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 150" role="img" aria-label="Refresco o Malta Fría">
  <defs>
    <linearGradient id="canGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#DC2626"/>
      <stop offset="50%" stop-color="#EF4444"/>
      <stop offset="100%" stop-color="#991B1B"/>
    </linearGradient>
    <linearGradient id="canTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#CBD5E1"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>
  </defs>
  <!-- Sombra -->
  <ellipse cx="100" cy="134" rx="44" ry="7" fill="#000000" opacity="0.35"/>
  <!-- Lata de Refresco -->
  <path d="M74 36 L126 36 L126 120 C126 128 74 128 74 120 Z" fill="url(#canGrad)"/>
  <ellipse cx="100" cy="36" rx="26" ry="7" fill="url(#canTop)"/>
  <ellipse cx="100" cy="36" rx="22" ry="5.5" fill="#64748B"/>
  <ellipse cx="100" cy="36" rx="14" ry="3.5" fill="#CBD5E1"/>
  <!-- Anilla de la lata -->
  <ellipse cx="96" cy="35" rx="5" ry="2.5" fill="#475569"/>
  <!-- Brillo metálico -->
  <path d="M84 42 L88 42 L88 122 L84 120 Z" fill="#FFFFFF" opacity="0.35"/>
  <path d="M92 42 L94 42 L94 122 L92 121 Z" fill="#FFFFFF" opacity="0.2"/>
  <!-- Franja decorativa estilo refresco -->
  <path d="M74 65 Q100 85 126 65 L126 80 Q100 100 74 80 Z" fill="#FFFFFF" opacity="0.9"/>
  <path d="M74 72 Q100 92 126 72 L126 78 Q100 98 74 78 Z" fill="#FBBF24"/>
  <!-- Gotas de frío / condensación -->
  <circle cx="82" cy="52" r="1.5" fill="#FFFFFF" opacity="0.8"/>
  <circle cx="80" cy="95" r="1.5" fill="#FFFFFF" opacity="0.8"/>
  <circle cx="116" cy="60" r="1.8" fill="#FFFFFF" opacity="0.8"/>
  <circle cx="118" cy="102" r="1.5" fill="#FFFFFF" opacity="0.8"/>
  <circle cx="112" cy="85" r="1.2" fill="#FFFFFF" opacity="0.8"/>
  <!-- Cubos de hielo al lado -->
  <rect x="134" y="104" width="20" height="20" rx="4" fill="#93C5FD" opacity="0.75" stroke="#BFDBFE" stroke-width="1.5" transform="rotate(15 134 104)"/>
  <rect x="48" y="108" width="18" height="18" rx="4" fill="#93C5FD" opacity="0.7" stroke="#BFDBFE" stroke-width="1.5" transform="rotate(-20 48 108)"/>
</svg>
